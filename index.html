<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Let's Chat!</title>
<style>
:root{--d1:#1e1f22;--d2:#2b2d31;--d3:#313338;--d4:#383a40;--text:#dbdee1;--mute:#949ba4;--bp:#5865f2;--gr:#23a55a;--rd:#f23f43}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:15px/1.4 "gg sans","Noto Sans","Segoe UI",system-ui,sans-serif;background:var(--d3);color:var(--text)}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
input,select,textarea{background:var(--d1);border:0;border-radius:6px;padding:10px;width:100%}
:focus-visible{outline:2px solid var(--bp)}[hidden]{display:none!important}
.btn{background:var(--bp);color:#fff;font-weight:600;border-radius:4px;padding:8px 16px}.btn.g{background:var(--d4)}.btn.r{background:var(--rd)}.btn.s{padding:4px 10px;font-size:13px}
#auth{height:100%;display:grid;place-items:center;padding:16px;background:var(--bp)}
#auth form{background:var(--d3);padding:32px;border-radius:6px;width:min(420px,100%);display:grid;gap:14px}
#auth h1{margin:0;text-align:center}#err{color:var(--rd);min-height:1.2em;font-size:13px}
#app{display:grid;grid-template-columns:72px 240px 1fr auto;height:100%}
#rail{background:var(--d1);display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 0;overflow-y:auto}
.srv{width:48px;height:48px;border-radius:50%;background:var(--d3);font-weight:700;color:var(--text);flex:none;transition:border-radius .15s,background .15s}
.srv:hover,.srv.on{border-radius:16px;background:var(--bp);color:#fff}.srv.add{color:var(--gr);font-size:22px}
#side{background:var(--d2);display:flex;flex-direction:column;min-width:0}
#sideTop{padding:14px 16px;font-weight:700;border-bottom:1px solid var(--d1);box-shadow:0 1px 0 #0002}
#sideTop small{display:block;font-weight:400}#sideTop small button{color:var(--mute);font-size:12px}
#list{flex:1;overflow-y:auto;padding:8px}.lab{font-size:12px;font-weight:700;color:var(--mute);padding:14px 8px 4px}
.row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:6px 8px;border-radius:4px;color:var(--mute)}
.row:hover{background:var(--d4);color:var(--text)}.row.on{background:#4e5058;color:#fff}
#panel{background:#232428;padding:8px;display:flex;align-items:center;gap:8px}#panel .chip{flex:1;min-width:0}
.chip{display:flex;align-items:center;gap:10px;min-width:0}.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;color:#fff;background-size:cover;background-position:center}
.av.l{width:80px;height:80px;font-size:32px;border:6px solid var(--d2)}
#main{display:flex;flex-direction:column;min-width:0;height:100%}
#top{display:flex;gap:10px;align-items:center;padding:12px 16px;font-weight:700;border-bottom:1px solid var(--d1)}
#tabs{display:flex;gap:6px;margin-left:12px}#tabs .btn{background:none;color:var(--mute)}#tabs .on{background:var(--d4);color:#fff}
#menu{display:none;font-size:20px}
#body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column}
.empty{margin:auto;color:var(--mute);text-align:center;max-width:340px}
.msg{display:grid;grid-template-columns:40px 1fr auto;gap:14px;padding:2px 8px;border-radius:4px;margin-top:14px}.msg.gp{margin-top:0}
.msg:hover{background:#2e3035}.msg .av{width:40px;height:40px;cursor:pointer}.msg.gp .av{visibility:hidden;height:0}
.msg b{cursor:pointer;margin-right:8px}.msg time{color:var(--mute);font-size:12px}.msg .t{white-space:pre-wrap;overflow-wrap:anywhere}
.msg img{display:block;max-width:min(340px,100%);max-height:280px;border-radius:8px;margin-top:4px}
.del{color:var(--rd);opacity:0;font-size:12px}.msg:hover .del{opacity:1}
.fr{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 8px;border-top:1px solid var(--d4)}.fr>div:last-child{display:flex;gap:6px}
#gifs{background:var(--d2);padding:10px;border-top:1px solid var(--d1)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px;max-height:230px;overflow-y:auto;margin-top:8px}
#grid button,#grid iframe{height:90px;width:100%;border:0;border-radius:6px;overflow:hidden;background:var(--d4)}#grid img{width:100%;height:100%;object-fit:cover}
#comp{display:flex;gap:8px;padding:0 16px 20px}#comp input{background:var(--d4);padding:12px}
#members{width:240px;background:var(--d2);padding:8px;overflow-y:auto}#members .chip{padding:6px 8px;cursor:pointer;border-radius:4px}#members .chip:hover{background:var(--d4)}
#ov{position:fixed;inset:0;background:#000a;display:grid;place-items:center;padding:16px;z-index:20}
.card{background:var(--d2);border-radius:8px;width:min(400px,100%);max-height:92vh;overflow-y:auto}.card .in{padding:16px;display:grid;gap:10px}
.ban{height:100px;background-size:cover;background-position:center}.card .av.l{margin:-40px 0 0 16px}
.card h3{margin:0}.card p{margin:0;color:var(--mute);white-space:pre-wrap}.acts{display:flex;gap:8px;flex-wrap:wrap}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--rd);padding:10px 16px;border-radius:6px;z-index:30}
@media(max-width:1000px){#members{display:none!important}#app{grid-template-columns:72px 240px 1fr}}
@media(max-width:720px){#app{grid-template-columns:1fr}#rail,#side{position:fixed;top:0;bottom:0;z-index:5;transform:translateX(-110%);transition:transform .2s}
#rail{left:0;width:72px}#side{left:72px;width:min(240px,calc(100vw - 72px))}body.nav #rail,body.nav #side{transform:none}#menu{display:block}#tabs{flex-wrap:wrap}}
</style></head><body>

<div id="auth" hidden><form id="af">
<h1>Let's Chat!</h1><div id="mode" style="text-align:center;color:var(--mute)">Welcome back</div>
<input id="em" type="email" placeholder="Email" required autocomplete="email">
<input id="un" placeholder="Username (letters, numbers, _ .)" autocomplete="username" hidden>
<input id="pw" type="password" placeholder="Password (6+ characters)" required minlength="6" autocomplete="current-password">
<div id="err" role="alert"></div>
<button class="btn" id="go">Log in</button>
<button type="button" class="btn g" id="sw">Need an account? Register</button>
</form></div>

<div id="app" hidden>
<nav id="rail" aria-label="Servers"></nav>
<aside id="side"><div id="sideTop"></div><div id="list"></div><div id="panel"></div></aside>
<main id="main">
 <div id="top"><button id="menu" aria-label="Menu">☰</button><span id="title"></span><div id="tabs"></div></div>
 <div id="body"></div>
 <div id="gifs" hidden><input id="gq" placeholder="Search Klipy GIFs" aria-label="Search GIFs"><div id="grid"></div></div>
 <div id="comp" hidden><button class="btn g" id="gifBtn" type="button">GIF</button><input id="txt" maxlength="2000" placeholder="Message" autocomplete="off" aria-label="Message"><button class="btn" id="send" type="button">Send</button></div>
</main>
<aside id="members" hidden></aside>
</div>
<div id="ov" hidden></div><div id="toast" hidden></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,getDoc,setDoc,addDoc,deleteDoc,updateDoc,writeBatch,arrayUnion,query,where,orderBy,limit,onSnapshot,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app=initializeApp({apiKey:"AIzaSyBEOV2av3PItbndEryFU-zzmAk2w28N0a0",authDomain:"lets-chat-d88e0.firebaseapp.com",projectId:"lets-chat-d88e0",storageBucket:"lets-chat-d88e0.firebasestorage.app",messagingSenderId:"409080143584",appId:"1:409080143584:web:1f6c404c525907f3d93a85"});
const KLIPY="uT8Yj9ap0Svy40pPstbu9tYZ61jMmMuVTPFoqbDP4k6ahOPdNwQpsuyieoxS7VxB";
const auth=getAuth(app),db=getFirestore(app);
const $=s=>document.querySelector(s);
const h=(t,p={},...k)=>{const e=document.createElement(t);for(const[a,v]of Object.entries(p)){if(a.startsWith("on"))e.addEventListener(a.slice(2),v);else if(a==="class")e.className=v;else e[a]=v}e.append(...k.filter(x=>x!=null));return e};
const toast=m=>{const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3500)};
const fail=m=>e=>{console.error(e);toast(m)};
const hue=s=>`hsl(${[...s].reduce((a,c)=>a+c.charCodeAt(0)*7,0)%360} 60% 50%)`;
const bg=(e,u)=>e.style.backgroundImage=`url("${u}")`;

let me,uid,rel=new Map(),servers=[],dms=[],chans=[],sid=null,view={t:"home"},tab="all",chat=null,unS,unR,unD,unC,unM,reg=false;
const cache=new Map();
const prof=u=>{if(!cache.has(u))cache.set(u,getDoc(doc(db,"users",u)).then(s=>({uid:u,username:"unknown",...(s.data()||{})})));return cache.get(u)};
const fillAv=(e,p)=>{if(p.avatar){e.style.background="";bg(e,p.avatar);e.textContent=""}else{e.style.background=hue(p.uid);e.textContent=(p.username||"?")[0].toUpperCase()}};
const chip=(u,click)=>{const a=h("div",{class:"av"}),n=h("span"),c=h("div",{class:"chip",onclick:click},a,n);prof(u).then(p=>{fillAv(a,p);n.textContent=p.displayName||p.username});return c};
const srv=()=>servers.find(s=>s.id===sid);

/* ---------- auth (email + password only) ---------- */
let signup=false;
const setMode=()=>{$("#un").hidden=!signup;$("#un").required=signup;$("#go").textContent=signup?"Create account":"Log in";$("#sw").textContent=signup?"Already have an account? Log in":"Need an account? Register";$("#mode").textContent=signup?"Create an account":"Welcome back";$("#err").textContent=""};
$("#sw").onclick=()=>{signup=!signup;setMode()};
$("#af").onsubmit=async e=>{
  e.preventDefault();const em=$("#em").value.trim(),pw=$("#pw").value,un=$("#un").value.trim().toLowerCase();$("#err").textContent="";
  try{
    if(!signup){await signInWithEmailAndPassword(auth,em,pw);return}
    if(!/^[a-z0-9_.]{2,32}$/.test(un))throw{message:"Username must be 2-32 letters, numbers, _ or ."};
    reg=true;const c=await createUserWithEmailAndPassword(auth,em,pw);
    try{const b=writeBatch(db);
      b.set(doc(db,"usernames",un),{uid:c.user.uid});
      b.set(doc(db,"users",c.user.uid),{username:un,displayName:un,bio:"",status:"online",avatar:"",banner:"",bannerColor:"#5865f2",createdAt:serverTimestamp()});
      await b.commit()}
    catch(x){await c.user.delete();throw{message:"That username is taken."}}
    reg=false;boot(auth.currentUser);
  }catch(x){reg=false;$("#err").textContent=x.code?x.code.replace("auth/","").replace(/-/g," "):x.message}
};
onAuthStateChanged(auth,u=>{if(reg)return;if(!u){$("#auth").hidden=false;$("#app").hidden=true;return}boot(u)});
async function boot(u){
  uid=u.uid;cache.delete(uid);me=await prof(uid);
  $("#auth").hidden=true;$("#app").hidden=false;
  unS=onSnapshot(query(collection(db,"servers"),where("memberIds","array-contains",uid)),s=>{servers=s.docs.map(d=>({id:d.id,...d.data()}));if(sid&&!srv()){goHome();return}rail()},fail("Couldn't load servers."));
  unR=onSnapshot(collection(db,"users",uid,"rel"),s=>{rel=new Map(s.docs.map(d=>[d.id,d.data().state]));if(view.t==="home"&&!chat)friends()},fail("Couldn't load friends."));
  unD=onSnapshot(query(collection(db,"dms"),where("members","array-contains",uid)),s=>{dms=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.updatedAt?.seconds||0)-(a.updatedAt?.seconds||0));if(view.t==="home"||view.t==="dm")side()},fail("Couldn't load DMs."));
  panel();goHome();
}
$("#menu").onclick=()=>document.body.classList.toggle("nav");

/* ---------- chrome ---------- */
function rail(){
  $("#rail").replaceChildren(
    h("button",{class:"srv"+(!sid?" on":""),title:"Home",textContent:"LC!",onclick:goHome}),
    ...servers.map(s=>h("button",{class:"srv"+(s.id===sid?" on":""),title:s.name,textContent:s.name[0].toUpperCase(),onclick:()=>openServer(s.id)})),
    h("button",{class:"srv add",title:"Create a server",textContent:"+",onclick:createServer}),
    h("button",{class:"srv add",title:"Join a server",textContent:"↪",onclick:joinServer}));
}
function panel(){
  const a=h("div",{class:"av"}),n=h("span"),st=h("small",{style:"color:var(--mute)"}),c=h("div",{class:"chip",style:"flex:1;cursor:pointer",onclick:()=>showProfile(uid)},a,h("div",{style:"min-width:0"},n,h("br"),st));
  prof(uid).then(p=>{fillAv(a,p);n.textContent=p.displayName||p.username;st.textContent=p.status||"online"});
  $("#panel").replaceChildren(c,h("button",{title:"Settings",textContent:"⚙",style:"font-size:20px",onclick:settings}));
}
function side(){
  const L=$("#list"),T=$("#sideTop");
  if(sid){const s=srv();T.replaceChildren(s.name,h("small",{},h("button",{textContent:"Copy invite code",onclick:()=>navigator.clipboard.writeText(s.id).then(()=>toast("Invite code copied"))})));
    L.replaceChildren(h("div",{class:"lab",textContent:"TEXT CHANNELS"}),...chans.map(c=>h("button",{class:"row"+(chat?.id===c.id?" on":""),textContent:"# "+c.name,onclick:()=>openChannel(c)})),
      ...(s.ownerId===uid?[h("button",{class:"row",textContent:"+ Add channel",onclick:addChannel})]:[]));return}
  T.textContent="Let's Chat!";
  L.replaceChildren(h("button",{class:"row"+(view.t==="home"?" on":""),textContent:"Friends",onclick:goHome}),h("div",{class:"lab",textContent:"DIRECT MESSAGES"}),
    ...dms.map(d=>{const o=d.members.find(x=>x!==uid);const c=chip(o);return h("button",{class:"row"+(chat?.id===d.id?" on":""),onclick:()=>openDM(o)},c)}));
}
function stop(){unC?.();unM?.();unC=unM=null;chat=null;$("#gifs").hidden=true;$("#comp").hidden=true;$("#members").hidden=true;$("#tabs").replaceChildren();document.body.classList.remove("nav")}

/* ---------- friends ---------- */
function goHome(){stop();sid=null;view={t:"home"};rail();side();friends()}
const relWrite=async(other,mine,theirs)=>{const b=writeBatch(db);
  mine===null?b.delete(doc(db,"users",uid,"rel",other)):b.set(doc(db,"users",uid,"rel",other),{state:mine});
  theirs===null?b.delete(doc(db,"users",other,"rel",uid)):theirs&&(theirs==="friend"?b.update(doc(db,"users",other,"rel",uid),{state:"friend"}):b.set(doc(db,"users",other,"rel",uid),{state:theirs}));
  await b.commit()};
const act={
  add:o=>relWrite(o,"outgoing","incoming").then(()=>toast("Friend request sent!")).catch(fail("Couldn't send request. They may have blocked you.")),
  accept:o=>relWrite(o,"friend","friend").catch(fail("Couldn't accept.")),
  remove:o=>relWrite(o,null,null).catch(fail("Couldn't update.")),
  block:async o=>{try{await setDoc(doc(db,"users",uid,"rel",o),{state:"blocked"});await deleteDoc(doc(db,"users",o,"rel",uid)).catch(()=>{});toast("User blocked")}catch(e){fail("Couldn't block.")(e)}},
  unblock:o=>deleteDoc(doc(db,"users",uid,"rel",o)).catch(fail("Couldn't unblock."))};
function friends(){
  if(view.t!=="home"||chat)return;
  $("#title").textContent="Friends";
  $("#tabs").replaceChildren(...[["all","All"],["pending","Pending"],["blocked","Blocked"],["add","Add Friend"]].map(([k,l])=>h("button",{class:"btn s"+(tab===k?" on":""),textContent:l,onclick:()=>{tab=k;friends()}})));
  const B=$("#body");
  if(tab==="add"){const i=h("input",{placeholder:"Enter a username",maxLength:32});
    B.replaceChildren(h("h3",{textContent:"Add Friend"}),h("p",{style:"color:var(--mute)",textContent:"You can add friends with their username."}),h("div",{style:"display:flex;gap:8px"},i,h("button",{class:"btn",textContent:"Send request",onclick:async()=>{
      const n=i.value.trim().toLowerCase().replace(/^@/,"");try{const s=await getDoc(doc(db,"usernames",n));if(!s.exists())return toast("No user with that username.");if(s.data().uid===uid)return toast("That's you!");
        const r=rel.get(s.data().uid);if(r==="incoming")return act.accept(s.data().uid);if(r)return toast("You already have a relationship with them.");act.add(s.data().uid);i.value=""}catch(e){fail("Couldn't find that user.")(e)}}})));return}
  const want=tab==="all"?["friend"]:tab==="pending"?["incoming","outgoing"]:["blocked"];
  const list=[...rel].filter(([,s])=>want.includes(s));
  B.replaceChildren(...(list.length?list.map(([o,s])=>h("div",{class:"fr"},chip(o,()=>showProfile(o)),h("div",{},
    ...(s==="friend"?[h("button",{class:"btn g s",textContent:"Message",onclick:()=>openDM(o)}),h("button",{class:"btn g s",textContent:"Remove",onclick:()=>act.remove(o)})]:
      s==="incoming"?[h("button",{class:"btn s",textContent:"Accept",onclick:()=>act.accept(o)}),h("button",{class:"btn g s",textContent:"Ignore",onclick:()=>act.remove(o)})]:
      s==="outgoing"?[h("button",{class:"btn g s",textContent:"Cancel",onclick:()=>act.remove(o)})]:
      [h("button",{class:"btn g s",textContent:"Unblock",onclick:()=>act.unblock(o)})])))):[h("div",{class:"empty",textContent:tab==="add"?"":"Nothing here yet. Use Add Friend to get started."})]));
}

/* ---------- servers & channels ---------- */
async function createServer(){
  const name=prompt("Server name")?.trim();if(!name)return;
  try{const r=await addDoc(collection(db,"servers"),{name:name.slice(0,50),ownerId:uid,memberIds:[uid],createdAt:serverTimestamp()});
    await addDoc(collection(db,"servers",r.id,"channels"),{name:"general",createdAt:serverTimestamp()});openServer(r.id)}catch(e){fail("Couldn't create the server.")(e)}
}
async function joinServer(){
  const c=prompt("Paste an invite code")?.trim();if(!c)return;if(srv(c))return openServer(c);
  try{await updateDoc(doc(db,"servers",c),{memberIds:arrayUnion(uid)});openServer(c)}catch(e){fail("Couldn't join. Check the invite code.")(e)}
}
function openServer(id){
  stop();sid=id;view={t:"srv"};chans=[];rail();side();$("#title").textContent=srv()?.name||"";
  $("#body").replaceChildren(h("div",{class:"empty",textContent:"Loading channels…"}));
  unC=onSnapshot(query(collection(db,"servers",id,"channels"),orderBy("createdAt")),s=>{chans=s.docs.map(d=>({id:d.id,...d.data()}));if(!chat||!chans.some(c=>c.id===chat.id))openChannel(chans[0]);else side()},fail("Couldn't load channels."));
  $("#members").hidden=false;$("#members").replaceChildren(h("div",{class:"lab",textContent:"MEMBERS — "+srv().memberIds.length}),...srv().memberIds.map(u=>chip(u,()=>showProfile(u))));
}
function addChannel(){const n=prompt("Channel name")?.trim().toLowerCase().replace(/\s+/g,"-").slice(0,30);if(n)addDoc(collection(db,"servers",sid,"channels"),{name:n,createdAt:serverTimestamp()}).catch(fail("Couldn't add channel."))}
function openChannel(c){if(!c)return;chat={id:c.id,col:collection(db,"servers",sid,"channels",c.id,"messages"),owner:srv()?.ownerId,empty:`Welcome to #${c.name}!`};$("#title").textContent="# "+c.name;side();sub()}

/* ---------- direct messages ---------- */
async function openDM(o){
  const m=[uid,o].sort(),id=m.join("_");
  try{await setDoc(doc(db,"dms",id),{members:m,updatedAt:serverTimestamp()},{merge:true})}catch(e){return fail("Couldn't open DM.")(e)}
  stop();sid=null;view={t:"dm"};rail();
  chat={id,col:collection(db,"dms",id,"messages"),owner:null,empty:"This is the start of your conversation."};
  prof(o).then(p=>$("#title").textContent="@"+(p.displayName||p.username));side();sub();$("#ov").hidden=true;
}

/* ---------- messages ---------- */
function sub(){
  unM?.();$("#comp").hidden=false;$("#gifs").hidden=true;const c=chat;
  unM=onSnapshot(query(c.col,orderBy("createdAt","desc"),limit(100)),async s=>{
    const list=s.docs.map(d=>({id:d.id,...d.data()})).reverse().filter(m=>rel.get(m.uid)!=="blocked");
    await Promise.all(list.map(m=>prof(m.uid)));if(chat!==c)return;
    const B=$("#body");let prev=null;
    B.replaceChildren(...(list.length?list.map(m=>{const t=m.createdAt?.toDate?.(),gp=prev&&prev.uid===m.uid&&t&&prev.t&&t-prev.t<420000;prev={uid:m.uid,t};return msg(m,t,gp,c)}):[h("div",{class:"empty",textContent:c.empty})]));
    B.scrollTop=B.scrollHeight;
  },fail("Couldn't load messages."));
}
function msg(m,t,gp,c){
  const a=h("div",{class:"av",onclick:()=>showProfile(m.uid)}),n=h("b",{onclick:()=>showProfile(m.uid)});
  prof(m.uid).then(p=>{fillAv(a,p);n.textContent=p.displayName||p.username});
  return h("div",{class:"msg"+(gp?" gp":"")},a,h("div",{},gp?null:h("div",{},n,h("time",{textContent:t?t.toLocaleString([],{dateStyle:"short",timeStyle:"short"}):"sending…"})),
    m.text?h("div",{class:"t",textContent:m.text}):null,m.gif?h("img",{src:m.gif,alt:"GIF",loading:"lazy"}):null),
    m.uid===uid||c.owner===uid?h("button",{class:"del",textContent:"Delete",onclick:()=>deleteDoc(doc(c.col,m.id)).catch(fail("Couldn't delete."))}):h("span"));
}
async function send(text="",gif=""){text=text.trim();if(!chat||(!text&&!gif))return;
  try{await addDoc(chat.col,{uid,text,gif,createdAt:serverTimestamp()})}catch(e){fail("Message didn't send. You may be blocked.")(e)}}
$("#send").onclick=()=>{send($("#txt").value);$("#txt").value=""};
$("#txt").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();$("#send").click()}};

/* ---------- profiles & settings ---------- */
const ov=c=>{const o=$("#ov");o.replaceChildren(h("div",{class:"card"},c));o.hidden=false;o.onclick=e=>{if(e.target===o)o.hidden=true}};
async function showProfile(u){
  const p=await prof(u),r=rel.get(u),a=h("div",{class:"av l"});fillAv(a,p);
  const ban=h("div",{class:"ban",style:`background-color:${p.bannerColor||"#5865f2"}`});if(p.banner)bg(ban,p.banner);
  const B=(t,f,c="g")=>h("button",{class:"btn s "+c,textContent:t,onclick:()=>{$("#ov").hidden=true;f()}});
  ov([ban,a,h("div",{class:"in"},h("h3",{textContent:p.displayName||p.username}),h("p",{textContent:"@"+p.username+" · "+(p.status||"online")}),p.bio?h("p",{style:"color:var(--text)",textContent:p.bio}):null,
    h("div",{class:"acts"},...(u===uid?[B("Edit profile",settings,"")]:[
      ...(r==="blocked"?[]:[B("Message",()=>openDM(u),"")]),
      ...(r==="friend"?[B("Remove friend",()=>act.remove(u))]:r==="incoming"?[B("Accept request",()=>act.accept(u),"")]:r==="outgoing"?[B("Request sent",()=>{})]:r==="blocked"?[]:[B("Add friend",()=>act.add(u))]),
      r==="blocked"?B("Unblock",()=>act.unblock(u)):B("Block",()=>act.block(u),"r")])))]);
}
const toUrl=(f,w,hh)=>new Promise(r=>{const i=new Image();i.onload=()=>{const c=document.createElement("canvas");c.width=w;c.height=hh;const k=Math.max(w/i.width,hh/i.height);c.getContext("2d").drawImage(i,(w-i.width*k)/2,(hh-i.height*k)/2,i.width*k,i.height*k);r(c.toDataURL("image/jpeg",.8))};i.src=URL.createObjectURL(f)});
async function settings(){
  const p=await prof(uid);let av=p.avatar||"",bn=p.banner||"";
  const dn=h("input",{value:p.displayName||"",maxLength:32}),bio=h("textarea",{value:p.bio||"",maxLength:190,rows:3}),col=h("input",{type:"color",value:p.bannerColor||"#5865f2",style:"height:40px;padding:2px"}),
    st=h("select",{},...["online","idle","dnd","offline"].map(s=>h("option",{value:s,textContent:s,selected:s===(p.status||"online")})));
  const fi=(l,w,hh,set)=>h("label",{},l,h("input",{type:"file",accept:"image/*",onchange:async e=>{if(e.target.files[0])set(await toUrl(e.target.files[0],w,hh))}}));
  ov(h("div",{class:"in"},h("h3",{textContent:"Edit profile"}),h("label",{},"Display name",dn),h("label",{},"About me",bio),h("label",{},"Status",st),
    fi("Avatar",128,128,v=>av=v),fi("Banner image",600,240,v=>bn=v),h("label",{},"Banner colour",col),
    h("div",{class:"acts"},h("button",{class:"btn",textContent:"Save changes",onclick:async()=>{
      try{await setDoc(doc(db,"users",uid),{displayName:dn.value.trim()||p.username,bio:bio.value,status:st.value,avatar:av,banner:bn,bannerColor:col.value},{merge:true});cache.delete(uid);me=await prof(uid);$("#ov").hidden=true;panel();toast("Profile saved")}catch(e){fail("Couldn't save. Images may be too large.")(e)}}}),
      h("button",{class:"btn r",textContent:"Log out",onclick:()=>signOut(auth).then(()=>location.reload())}))));
}

/* ---------- Klipy GIFs (ads enabled) ---------- */
$("#gifBtn").onclick=()=>{const g=$("#gifs");g.hidden=!g.hidden;if(!g.hidden){$("#gq").focus();gifs("")}};
let gt;$("#gq").oninput=e=>{clearTimeout(gt);gt=setTimeout(()=>gifs(e.target.value.trim()),350)};
async function gifs(q){
  const g=$("#grid");
  try{const u=new URL(`https://api.klipy.com/api/v1/${KLIPY}/gifs/${q?"search":"trending"}`);if(q)u.searchParams.set("q",q);u.searchParams.set("per_page","24");u.searchParams.set("customer_id",uid);
    const j=await(await fetch(u)).json(),items=j?.data?.data||j?.data||[];
    g.replaceChildren(...items.map(it=>{
      if(it.type==="ad"||it.content)return h("iframe",{sandbox:"allow-scripts allow-popups",srcdoc:it.content||"",title:"Ad"});
      const f=it.file||{},s=(f.md||f.hd||f.sm||{}).gif?.url,full=(f.hd||f.md||f.sm||{}).gif?.url||s;if(!s)return null;
      return h("button",{type:"button",title:it.title||"GIF",onclick:()=>{send("",full);$("#gifs").hidden=true}},h("img",{src:s,alt:it.title||"GIF",loading:"lazy"}))}).filter(Boolean));
    if(!items.length)g.textContent="No GIFs found."}catch(e){fail("GIF search failed.")(e)}
}
