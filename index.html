<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lets Chat!</title>
<style>
:root{--rail:#1e1f22;--side:#2b2d31;--bg:#313338;--in:#383a40;--tx:#dbdee1;--mu:#949ba4;--ac:#5865f2;--ok:#23a559;--bad:#da373c}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font:15px/1.4 "gg sans","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx)}
[hidden]{display:none!important}button,input{font:inherit;color:inherit}button{cursor:pointer;border:0}
#auth{height:100%;display:grid;place-items:center;background:var(--ac)}
#auth form,#auth>div{background:var(--bg);padding:32px;border-radius:8px;width:min(92vw,420px);display:grid;gap:12px}
#auth h1{margin:0;text-align:center}#auth input{background:var(--rail);border:0;border-radius:4px;padding:11px}
.pri{background:var(--ac);color:#fff;border-radius:4px;padding:10px 16px}.sec{background:none;color:var(--ac);padding:6px}
#err{color:#ff8b8e;min-height:1.2em;font-size:13px}
#app{height:100%;display:flex}
#rail{width:72px;background:var(--rail);display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 0;overflow:auto}
.ri{width:48px;height:48px;border-radius:50%;background:var(--bg);font-weight:600;position:relative;flex:none}
.ri:hover,.ri.on{background:var(--ac);border-radius:16px;color:#fff}.bd{position:absolute;right:-4px;bottom:-4px;background:var(--bad);color:#fff;font-size:11px;border-radius:9px;padding:0 6px;font-style:normal}
#rail hr{width:32px;border:0;border-top:2px solid var(--bg);margin:0}
#side{width:240px;background:var(--side);display:flex;flex-direction:column;flex:none}
#side .top{padding:14px;font-weight:700;border-bottom:1px solid #0003;display:flex;justify-content:space-between;align-items:center}
#side .list{flex:1;overflow:auto;padding:8px}
.it{display:flex;align-items:center;gap:10px;width:100%;background:none;text-align:left;padding:7px 10px;border-radius:4px;color:var(--mu)}
.it:hover,.it.on{background:#404249;color:#fff}.lbl{font-size:12px;color:var(--mu);padding:12px 10px 4px;font-weight:600}
.me{display:flex;align-items:center;gap:8px;padding:8px;background:#232428}.me b{flex:1;overflow:hidden;text-overflow:ellipsis}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
.hd{height:48px;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid #0003;font-weight:700;flex:none}
.tab{background:none;color:var(--mu);padding:4px 10px;border-radius:4px}.tab.on{background:#404249;color:#fff}
.pg{padding:20px;overflow:auto;display:grid;gap:8px;align-content:start}.row{display:flex;align-items:center;gap:12px;padding:10px;border-top:1px solid #3f4147}
.row span{flex:1}.row button{background:#404249;padding:6px 12px;border-radius:4px}.row .go{background:var(--ok)}
.msgs{flex:1;overflow:auto;padding:12px 16px}.msg{display:flex;gap:12px;padding:6px 0;position:relative}.msg .x{position:absolute;right:0;top:4px;background:none;color:var(--mu);display:none}.msg:hover .x{display:block}
.mh time{color:var(--mu);font-size:12px;margin-left:8px}.tx{white-space:pre-wrap;overflow-wrap:anywhere}.gif{max-width:min(320px,100%);max-height:260px;border-radius:6px;display:block;margin-top:4px}
.cmp{display:flex;gap:8px;margin:0 16px 20px;background:var(--in);border-radius:8px;padding:6px;position:relative}.cmp input{flex:1;background:none;border:0;outline:0;padding:8px}.cmp button{background:none;font-weight:800;color:var(--mu);padding:0 10px}
.gp{position:absolute;bottom:56px;right:0;width:min(420px,92vw);height:380px;background:var(--side);border-radius:8px;box-shadow:0 8px 24px #0008;display:flex;flex-direction:column;padding:10px;gap:8px;z-index:5}
.gp input{background:var(--rail);border-radius:4px;border:0;padding:8px;outline:0}.grid{flex:1;overflow:auto;columns:2;gap:6px}.grid img{width:100%;border-radius:4px;margin-bottom:6px;cursor:pointer;display:block}.grid iframe{width:100%;border:0;margin-bottom:6px}
.gp small{color:var(--mu)}
#mem{width:240px;background:var(--side);padding:12px;overflow:auto;flex:none}#mem .it{color:var(--tx);padding:5px 8px}
.empty{margin:auto;color:var(--mu);text-align:center}
@media(max-width:900px){#mem{display:none}#side{width:180px}}
</style></head><body>
<div id="auth"><div>
<h1>Lets Chat!</h1><input id="em" type="email" placeholder="Email" autocomplete="email"><input id="pw" type="password" placeholder="Password (6+ characters)" autocomplete="current-password">
<div id="err"></div><button class="pri" id="in">Log in</button><button class="sec" id="up">Create an account</button></div></div>
<div id="app" hidden><nav id="rail"></nav><aside id="side"></aside><main id="main"></main><aside id="mem" hidden></aside></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyBEOV2av3PItbndEryFU-zzmAk2w28N0a0",authDomain:"lets-chat-d88e0.firebaseapp.com",projectId:"lets-chat-d88e0",storageBucket:"lets-chat-d88e0.firebasestorage.app",messagingSenderId:"409080143584",appId:"1:409080143584:web:1f6c404c525907f3d93a85"});
const KLIPY="uT8Yj9ap0Svy40pPstbu9tYZ61jMmMuVTPFoqbDP4k6ahOPdNwQpsuyieoxS7VxB";
const auth=firebase.auth(),db=firebase.firestore();
const $=q=>document.querySelector(q),ts=()=>firebase.firestore.FieldValue.serverTimestamp(),pair=(a,b)=>[a,b].sort().join('_');
function h(t,c,x,k){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;if(k)e.onclick=k;return e}
function av(n){const e=h('div','av',(n||'?')[0].toUpperCase());e.style.background=`hsl(${[...n].reduce((a,c)=>a+c.charCodeAt(0)*7,0)%360} 55% 45%)`;return e}
let me,prof,servers=[],reqs=[],cur={t:'home'},offs=[],offMsg=()=>{},offCh=()=>{},send=()=>{};const names={};
async function nameOf(u){if(!names[u]){try{const d=await db.doc('users/'+u).get();names[u]=d.exists?d.data().name:'unknown'}catch(e){names[u]='unknown'}}return names[u]}

// ---------- auth (email + password only) ----------
async function doAuth(up){$('#err').textContent='';try{const e=$('#em').value.trim(),p=$('#pw').value;up?await auth.createUserWithEmailAndPassword(e,p):await auth.signInWithEmailAndPassword(e,p)}catch(x){$('#err').textContent=x.message.replace('Firebase: ','')}}
$('#in').onclick=()=>doAuth(false);$('#up').onclick=()=>doAuth(true);
auth.onAuthStateChanged(async u=>{
  offs.forEach(f=>f());offs=[];offMsg();offCh();
  if(!u){me=null;$('#app').hidden=true;$('#auth').hidden=false;return}
  me=u;let d=await db.doc('users/'+u.uid).get();
  if(!d.exists){ // username is taken from the email prefix
    const base=(u.email.split('@')[0].toLowerCase().replace(/[^a-z0-9_]/g,'')||'user').slice(0,20);let n=base;
    for(let i=0;i<8;i++){try{await db.doc('usernames/'+n).set({uid:u.uid});break}catch(e){n=base+Math.floor(Math.random()*9999)}}
    await db.doc('users/'+u.uid).set({name:n,created:ts()});d=await db.doc('users/'+u.uid).get()}
  prof=d.data();names[u.uid]=prof.name;$('#auth').hidden=true;$('#app').hidden=false;
  offs.push(db.collection('servers').where('members','array-contains',u.uid).onSnapshot(s=>{servers=s.docs.map(x=>({id:x.id,...x.data()}));render()},console.error));
  offs.push(db.collection('requests').where('users','array-contains',u.uid).onSnapshot(s=>{reqs=s.docs.map(x=>({id:x.id,...x.data()}));render();if(cur.t=='home')homeMain()},console.error));
  go('home')});

// ---------- navigation ----------
const friends=()=>reqs.filter(q=>q.status=='accepted').map(q=>({uid:q.users.find(x=>x!=me.uid),name:q.names[q.users.find(x=>x!=me.uid)]}));
function go(t,o={}){offMsg();offCh();cur={t,...o};$('#main').replaceChildren();
  if(t=='server'){cur.chans=[];offCh=db.collection('servers/'+o.sid+'/channels').orderBy('created').onSnapshot(s=>{cur.chans=s.docs.map(x=>({id:x.id,...x.data()}));if(!cur.cid&&cur.chans[0]){cur.cid=cur.chans[0].id;openChat()}render()},console.error)}
  render();if(t=='home')homeMain();if(t=='dm')openChat()}
function render(){rail();side();mem()}
function rail(){const r=$('#rail');r.replaceChildren();const p=reqs.filter(q=>q.status=='pending'&&q.to==me.uid).length;
  const hb=h('button','ri'+(cur.t!='server'?' on':''),'💬',()=>go('home'));if(p)hb.append(h('i','bd',p));r.append(hb,h('hr'));
  servers.forEach(s=>r.append(h('button','ri'+(cur.sid==s.id?' on':''),s.name.slice(0,2),()=>go('server',{sid:s.id}))));
  r.append(h('button','ri','+',async()=>{const n=(prompt('Name your new server')||'').trim();if(!n)return;const ref=await db.collection('servers').add({name:n,owner:me.uid,members:[me.uid],created:ts()});await ref.collection('channels').add({name:'general',created:ts()});go('server',{sid:ref.id})}),
    h('button','ri','↪',async()=>{const c=(prompt('Paste an invite code')||'').trim();if(!c)return;try{await db.doc('servers/'+c).update({members:firebase.firestore.FieldValue.arrayUnion(me.uid)});go('server',{sid:c})}catch(e){alert('Could not join that server.')}}))}
function side(){const s=$('#side');s.replaceChildren();const l=h('div','list');
  if(cur.t=='server'){const sv=servers.find(x=>x.id==cur.sid);if(!sv){s.append(h('div','top','…'));return}
    s.append(h('div','top',sv.name));l.append(h('button','it','Copy invite code',()=>{navigator.clipboard.writeText(sv.id);alert('Invite code copied. Friends join with the ↪ button.')}),h('div','lbl','Text channels'));
    (cur.chans||[]).forEach(c=>l.append(h('button','it'+(cur.cid==c.id?' on':''),'# '+c.name,()=>{cur.cid=c.id;openChat();render()})));
    if(sv.owner==me.uid)l.append(h('button','it','+ Add channel',async()=>{const n=(prompt('Channel name')||'').trim().toLowerCase().replace(/\s+/g,'-');if(n)await db.collection('servers/'+sv.id+'/channels').add({name:n,created:ts()})}))}
  else{s.append(h('div','top','Lets Chat!'));l.append(h('button','it'+(cur.t=='home'?' on':''),'👥 Friends',()=>go('home')),h('div','lbl','Direct messages'));
    friends().forEach(f=>l.append(h('button','it'+(cur.uid==f.uid?' on':''),f.name,()=>go('dm',{uid:f.uid,name:f.name}))))}
  const m=h('div','me');m.append(av(prof.name),h('b',null,prof.name),h('button','tab','Log out',()=>auth.signOut()));s.append(l,m)}
async function mem(){const m=$('#mem');m.hidden=cur.t!='server';if(m.hidden)return;const sv=servers.find(x=>x.id==cur.sid);if(!sv)return;
  const ns=await Promise.all(sv.members.map(nameOf));m.replaceChildren(h('div','lbl','Members — '+ns.length));ns.forEach(n=>{const i=h('div','it');i.append(av(n),h('span',null,n));m.append(i)})}

// ---------- friends ----------
async function addF(n){n=n.trim().toLowerCase();if(!n)return'Enter a username';const u=await db.doc('usernames/'+n).get();if(!u.exists)return'No user with that name';const o=u.data().uid;if(o==me.uid)return"That's you!";
  try{await db.doc('requests/'+pair(me.uid,o)).set({users:[me.uid,o].sort(),from:me.uid,to:o,status:'pending',names:{[me.uid]:prof.name,[o]:n},created:ts()});return'Friend request sent to '+n}catch(e){return'You already have a request or friendship with them'}}
function homeMain(){const m=$('#main'),tab=cur.tab||'all';m.replaceChildren();const hd=h('div','hd');
  [['all','All friends'],['pending','Pending'],['add','Add friend']].forEach(([k,t])=>hd.append(h('button','tab'+(tab==k?' on':''),t,()=>{cur.tab=k;homeMain()})));
  const b=h('div','pg');m.append(hd,b);
  if(tab=='add'){const i=h('input');i.placeholder='Enter a username';i.style.cssText='background:var(--rail);border:0;padding:11px;border-radius:4px';const st=h('div');
    b.append(h('div',null,'Add a friend with their username (the part of their email before the @).'),i,h('button','pri','Send friend request',async()=>st.textContent=await addF(i.value)),st)}
  else if(tab=='all'){const f=friends();if(!f.length)b.append(h('div','empty','No friends yet. Use “Add friend” to get started.'));
    f.forEach(x=>{const r=h('div','row');r.append(av(x.name),h('span',null,x.name),h('button','go','Message',()=>go('dm',{uid:x.uid,name:x.name})),h('button',null,'Remove',()=>db.doc('requests/'+pair(me.uid,x.uid)).delete()));b.append(r)})}
  else{const p=reqs.filter(q=>q.status=='pending');if(!p.length)b.append(h('div','empty','No pending requests.'));
    p.forEach(q=>{const inc=q.to==me.uid,o=q.users.find(x=>x!=me.uid),r=h('div','row');r.append(av(q.names[o]),h('span',null,q.names[o]+(inc?' wants to be friends':' (request sent)')));
      if(inc)r.append(h('button','go','Accept',()=>db.doc('requests/'+q.id).update({status:'accepted'})));
      r.append(h('button',null,inc?'Decline':'Cancel',()=>db.doc('requests/'+q.id).delete()));b.append(r)})}}

// ---------- chat ----------
function openChat(){offMsg();let path,title;
  if(cur.t=='dm'){path='dms/'+pair(me.uid,cur.uid)+'/messages';title='@ '+cur.name}
  else{const c=cur.chans.find(x=>x.id==cur.cid);if(!c)return;path='servers/'+cur.sid+'/channels/'+cur.cid+'/messages';title='# '+c.name}
  const m=$('#main'),box=h('div','msgs'),inp=h('input'),gp=h('div','gp');gp.hidden=true;inp.placeholder='Message '+title;
  send=async o=>{try{await db.collection(path).add({a:me.uid,n:prof.name,t:'',g:null,...o,ts:ts()})}catch(e){alert('Could not send message.')}};
  const go_=()=>{const t=inp.value.trim();if(t){send({t});inp.value=''}};inp.onkeydown=e=>{if(e.key=='Enter')go_()};
  const gs=h('input');gs.placeholder='Search KLIPY GIFs';let tm;gs.oninput=()=>{clearTimeout(tm);tm=setTimeout(()=>gifs(gs.value,gp),350)};
  gp.append(gs,h('div','grid'),h('small',null,'Powered by KLIPY'));
  const cmp=h('div','cmp');cmp.append(inp,h('button',null,'GIF',()=>{gp.hidden=!gp.hidden;if(!gp.hidden){gs.value='';gifs('',gp)}}),h('button',null,'Send',go_),gp);
  m.replaceChildren(h('div','hd',title),box,cmp);let first=true;
  offMsg=db.collection(path).orderBy('ts').limitToLast(100).onSnapshot(s=>{const bot=first||box.scrollTop+box.clientHeight>=box.scrollHeight-80;box.replaceChildren();
    s.docs.forEach(d=>{const x=d.data({serverTimestamps:'estimate'}),row=h('div','msg'),b=h('div'),hd=h('div','mh');
      hd.append(h('b',null,x.n),h('time',null,x.ts?x.ts.toDate().toLocaleString([],{dateStyle:'short',timeStyle:'short'}):''));b.append(hd);
      if(x.t)b.append(h('div','tx',x.t));if(typeof x.g=='string'&&x.g.startsWith('https://')){const i=h('img','gif');i.src=x.g;i.loading='lazy';b.append(i)}
      row.append(av(x.n),b);if(x.a==me.uid)row.append(h('button','x','✕',()=>d.ref.delete()));box.append(row)});
    if(bot)box.scrollTop=box.scrollHeight;first=false},console.error)}

// ---------- KLIPY GIFs (ads enabled: ad items are shown in a sandboxed frame) ----------
async function gifs(q,gp){const g=gp.querySelector('.grid');g.textContent='Loading…';
  try{const u=`https://api.klipy.com/api/v1/${KLIPY}/gifs/${q?'search':'trending'}?`+new URLSearchParams({q,page:1,per_page:24,customer_id:me.uid});
    const r=await(await fetch(u)).json(),items=r.data?.data||[];g.replaceChildren();
    items.forEach(it=>{
      if(it.type=='ad'&&it.content){const f=h('iframe');f.sandbox='allow-scripts allow-popups allow-popups-to-escape-sandbox';f.srcdoc=it.content;f.style.height=(it.height||250)+'px';g.append(f);return}
      const f=it.file||{},url=(f.md||f.hd||f.sm||{}).gif?.url;if(!url)return;
      const i=h('img');i.src=url;i.alt=it.title||'gif';i.onclick=()=>{send({g:url});gp.hidden=true};g.append(i)});
    if(!g.children.length)g.textContent='No GIFs found'}catch(e){g.textContent='GIF search failed'}}
</script></body></html>
