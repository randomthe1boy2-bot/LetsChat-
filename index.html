<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Let's Chat!</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#1b1422;--panel:#241a2e;--rail:#150f1b;--line:#33263f;--text:#f4ecfa;--mute:#a897b8;--acc:#ff7a45;--mint:#5ee6b8}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:15px/1.45 "Bricolage Grotesque",system-ui,sans-serif;background:var(--bg);color:var(--text)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
input{background:var(--rail);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
[hidden]{display:none!important}
.btn{background:var(--acc);color:#1b0b04;font-weight:600;border-radius:10px;padding:10px 16px}
.btn.alt{background:var(--line);color:var(--text)}
#auth{height:100%;display:grid;place-items:center;padding:24px}
#auth .box{width:min(380px,100%);display:grid;gap:12px}
#auth h1{font-size:56px;line-height:1;margin:0 0 8px;font-weight:800;letter-spacing:-.03em;transform:rotate(-2deg)}
#auth p{margin:0 0 8px;color:var(--mute)}
#app{display:grid;grid-template-columns:72px 240px 1fr;height:100%}
#rail{background:var(--rail);display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 0;overflow-y:auto}
.srv{width:48px;height:48px;border-radius:50%;background:var(--panel);font-weight:800;font-size:18px;transition:border-radius .15s,background .15s}
.srv:hover,.srv.on{border-radius:16px;background:var(--acc);color:#1b0b04}
.srv.add{color:var(--mint);font-size:24px}
#side{background:var(--panel);display:flex;flex-direction:column;min-width:0}
#side header{padding:16px;border-bottom:1px solid var(--line);font-weight:800;font-size:17px}
#side header small{display:block;font-weight:400;color:var(--mute)}
#chs{flex:1;overflow-y:auto;padding:8px}
.ch{display:block;width:100%;text-align:left;padding:7px 10px;border-radius:8px;color:var(--mute)}
.ch:hover{background:var(--line);color:var(--text)}
.ch.on{background:var(--line);color:var(--text);font-weight:600}
#me-bar{padding:12px 16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
#me-bar button{color:var(--mute);font-size:13px}
#main{display:flex;flex-direction:column;min-width:0;height:100%}
#top{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);font-weight:800}
#menu{display:none;font-size:20px}
#msgs{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.empty{margin:auto;text-align:center;color:var(--mute);max-width:320px}
.msg{display:grid;grid-template-columns:40px 1fr auto;gap:12px}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#1b0b04}
.msg b{margin-right:8px}
.msg time{color:var(--mute);font-size:12px}
.msg .t{white-space:pre-wrap;overflow-wrap:anywhere}
.msg img{display:block;max-width:min(320px,100%);max-height:260px;border-radius:10px;margin-top:6px}
.del{color:var(--mute);opacity:0;font-size:13px}
.msg:hover .del,.del:focus-visible{opacity:1}
#gifs{border-top:1px solid var(--line);background:var(--panel);padding:12px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px;max-height:240px;overflow-y:auto;margin-top:10px}
#grid button,#grid iframe{height:90px;width:100%;border-radius:8px;overflow:hidden;border:0;background:var(--line)}
#grid img{width:100%;height:100%;object-fit:cover}
#comp{display:flex;gap:8px;padding:14px 18px}
#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--acc);color:#1b0b04;padding:10px 16px;border-radius:10px;font-weight:600;max-width:90vw}
@media(max-width:720px){
 #app{grid-template-columns:1fr}
 #rail,#side{position:fixed;top:0;bottom:0;z-index:5;transform:translateX(-110%);transition:transform .2s}
 #rail{left:0;width:72px}#side{left:72px;width:min(240px,calc(100vw - 72px))}
 body.nav #rail,body.nav #side{transform:none}
 #menu{display:block}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="auth" hidden>
  <div class="box">
    <h1>Let's Chat!</h1>
    <p>Make a server, share the invite code, start talking.</p>
    <button class="btn" id="google">Continue with Google</button>
    <input id="guest" placeholder="Or pick a guest name" maxlength="32" aria-label="Guest name">
    <button class="btn alt" id="guestGo">Join as guest</button>
  </div>
</div>

<div id="app" hidden>
  <nav id="rail" aria-label="Servers"></nav>
  <aside id="side">
    <header><span id="sname">No server</span><small id="sinv"></small></header>
    <div id="chs"></div>
    <div id="me-bar"><span id="me"></span><button id="out">Sign out</button></div>
  </aside>
  <main id="main">
    <div id="top"><button id="menu" aria-label="Toggle menu">☰</button><span id="cname">Pick a server</span></div>
    <div id="msgs"></div>
    <div id="gifs" hidden>
      <input id="gq" placeholder="Search GIFs" aria-label="Search GIFs">
      <div id="grid"></div>
    </div>
    <div id="comp">
      <button class="btn alt" id="gifBtn" type="button">GIF</button>
      <input id="txt" placeholder="Message" maxlength="2000" autocomplete="off" aria-label="Message">
      <button class="btn" id="send" type="button">Send</button>
    </div>
  </main>
</div>
<div id="toast" hidden></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signInAnonymously,updateProfile,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,addDoc,deleteDoc,updateDoc,arrayUnion,query,where,orderBy,limit,onSnapshot,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyBEOV2av3PItbndEryFU-zzmAk2w28N0a0",
  authDomain:"lets-chat-d88e0.firebaseapp.com",
  projectId:"lets-chat-d88e0",
  storageBucket:"lets-chat-d88e0.firebasestorage.app",
  messagingSenderId:"409080143584",
  appId:"1:409080143584:web:1f6c404c525907f3d93a85"
};
const KLIPY_KEY="uT8Yj9ap0Svy40pPstbu9tYZ61jMmMuVTPFoqbDP4k6ahOPdNwQpsuyieoxS7VxB";

const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=s=>document.querySelector(s);
const h=(t,p={},...k)=>{const e=document.createElement(t);for(const[a,v]of Object.entries(p)){if(a.startsWith("on"))e.addEventListener(a.slice(2),v);else if(a==="class")e.className=v;else e[a]=v}e.append(...k);return e};
const toast=m=>{const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3500)};
const fail=m=>e=>{console.error(e);toast(m)};
const hue=s=>`hsl(${[...s].reduce((a,c)=>a+c.charCodeAt(0)*7,0)%360} 80% 70%)`;

let user,servers=[],channels=[],sid=null,cid=null,unCh,unMsg;
const srv=()=>servers.find(s=>s.id===sid);

/* ---------- auth ---------- */
$("#google").onclick=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(fail("Google sign-in failed. Check that it's enabled in Firebase Auth."));
$("#guestGo").onclick=async()=>{
  const n=$("#guest").value.trim();
  if(!n)return toast("Enter a guest name first.");
  try{const c=await signInAnonymously(auth);await updateProfile(c.user,{displayName:n});location.reload()}
  catch(e){fail("Guest sign-in failed. Enable Anonymous auth in Firebase.")(e)}
};
$("#out").onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{
  user=u;$("#auth").hidden=!!u;$("#app").hidden=!u;
  if(u){$("#me").textContent=u.displayName||"Guest";listenServers()}
});

/* ---------- servers ---------- */
function listenServers(){
  onSnapshot(query(collection(db,"servers"),where("memberIds","array-contains",user.uid)),s=>{
    servers=s.docs.map(d=>({id:d.id,...d.data()}));
    if(!srv())pick(servers[0]?.id??null);else renderRail();
  },fail("Couldn't load your servers. Check your Firestore rules."));
}
function renderRail(){
  const r=$("#rail");r.replaceChildren(
    ...servers.map(s=>h("button",{class:"srv"+(s.id===sid?" on":""),title:s.name,textContent:s.name[0].toUpperCase(),onclick:()=>pick(s.id)})),
    h("button",{class:"srv add",title:"Create server",textContent:"+",onclick:createServer}),
    h("button",{class:"srv add",title:"Join with invite code",textContent:"↪",onclick:joinServer})
  );
}
async function createServer(){
  const name=prompt("Server name")?.trim();if(!name)return;
  try{
    const ref=await addDoc(collection(db,"servers"),{name:name.slice(0,50),ownerId:user.uid,memberIds:[user.uid],createdAt:serverTimestamp()});
    await addDoc(collection(db,"servers",ref.id,"channels"),{name:"general",createdAt:serverTimestamp()});
    pick(ref.id);
  }catch(e){fail("Couldn't create the server.")(e)}
}
async function joinServer(){
  const code=prompt("Paste an invite code")?.trim();if(!code)return;
  if(servers.some(s=>s.id===code))return pick(code);
  try{await updateDoc(doc(db,"servers",code),{memberIds:arrayUnion(user.uid)});pick(code)}
  catch(e){fail("Couldn't join. Check the invite code.")(e)}
}
function pick(id){
  sid=id;cid=null;unCh?.();unMsg?.();channels=[];renderRail();document.body.classList.remove("nav");
  const s=srv();
  $("#sname").textContent=s?s.name:"No server";
  $("#sinv").replaceChildren(...(s?[h("button",{textContent:"Copy invite code",onclick:()=>navigator.clipboard.writeText(s.id).then(()=>toast("Invite code copied"))})]:[]));
  if(!s){$("#chs").replaceChildren();$("#cname").textContent="Pick a server";$("#msgs").replaceChildren(h("div",{class:"empty",textContent:"Create a server with + or join one with an invite code."}));return}
  unCh=onSnapshot(query(collection(db,"servers",id,"channels"),orderBy("createdAt")),sn=>{
    channels=sn.docs.map(d=>({id:d.id,...d.data()}));renderChannels();
    if(!channels.some(c=>c.id===cid))openChannel(channels[0]?.id);
  },fail("Couldn't load channels."));
}

/* ---------- channels ---------- */
function renderChannels(){
  const own=srv()?.ownerId===user.uid;
  $("#chs").replaceChildren(
    ...channels.map(c=>h("button",{class:"ch"+(c.id===cid?" on":""),textContent:"# "+c.name,onclick:()=>openChannel(c.id)})),
    ...(own?[h("button",{class:"ch",textContent:"+ Add channel",onclick:addChannel})]:[])
  );
}
async function addChannel(){
  const n=prompt("Channel name")?.trim().toLowerCase().replace(/\s+/g,"-").slice(0,30);if(!n)return;
  addDoc(collection(db,"servers",sid,"channels"),{name:n,createdAt:serverTimestamp()}).catch(fail("Couldn't add the channel."));
}

/* ---------- messages ---------- */
function openChannel(id){
  cid=id;unMsg?.();renderChannels();document.body.classList.remove("nav");
  const c=channels.find(x=>x.id===id);$("#cname").textContent=c?"# "+c.name:"No channels";
  if(!c)return;
  unMsg=onSnapshot(query(collection(db,"servers",sid,"channels",id,"messages"),orderBy("createdAt","desc"),limit(100)),sn=>{
    const box=$("#msgs");
    const list=sn.docs.map(d=>({id:d.id,...d.data()})).reverse();
    box.replaceChildren(...(list.length?list.map(renderMsg):[h("div",{class:"empty",textContent:`This is the start of #${c.name}. Say hi!`})]));
    box.scrollTop=box.scrollHeight;
  },fail("Couldn't load messages."));
}
function renderMsg(m){
  const t=m.createdAt?.toDate?.();
  const canDel=m.uid===user.uid||srv()?.ownerId===user.uid;
  return h("div",{class:"msg"},
    h("div",{class:"av",style:`background:${hue(m.uid)}`,textContent:(m.name||"?")[0].toUpperCase()}),
    h("div",{},
      h("div",{},h("b",{textContent:m.name||"Guest"}),h("time",{textContent:t?t.toLocaleString([],{dateStyle:"short",timeStyle:"short"}):"sending…"})),
      ...(m.text?[h("div",{class:"t",textContent:m.text})]:[]),
      ...(m.gif?[h("img",{src:m.gif,alt:"GIF",loading:"lazy"})]:[])
    ),
    canDel?h("button",{class:"del",textContent:"Delete",onclick:()=>deleteDoc(doc(db,"servers",sid,"channels",cid,"messages",m.id)).catch(fail("Couldn't delete."))}):h("span")
  );
}
async function send(text="",gif=""){
  text=text.trim();if(!cid||(!text&&!gif))return;
  try{
    await addDoc(collection(db,"servers",sid,"channels",cid,"messages"),{uid:user.uid,name:(user.displayName||"Guest").slice(0,40),text,gif,createdAt:serverTimestamp()});
  }catch(e){fail("Message didn't send.")(e)}
}
$("#send").onclick=()=>{send($("#txt").value);$("#txt").value=""};
$("#txt").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();$("#send").click()}};
$("#menu").onclick=()=>document.body.classList.toggle("nav");

/* ---------- Klipy GIFs (ads enabled) ---------- */
$("#gifBtn").onclick=()=>{const g=$("#gifs");g.hidden=!g.hidden;if(!g.hidden){$("#gq").focus();loadGifs("")}};
let gt;$("#gq").oninput=e=>{clearTimeout(gt);gt=setTimeout(()=>loadGifs(e.target.value.trim()),350)};
async function loadGifs(q){
  const grid=$("#grid");
  try{
    const u=new URL(`https://api.klipy.com/api/v1/${KLIPY_KEY}/gifs/${q?"search":"trending"}`);
    if(q)u.searchParams.set("q",q);
    u.searchParams.set("per_page","24");u.searchParams.set("customer_id",user.uid);
    const j=await (await fetch(u)).json();
    const items=j?.data?.data||j?.data||[];
    grid.replaceChildren(...items.map(it=>{
      // Ads come back mixed in with GIFs; render their HTML in a sandboxed frame, as Klipy requires.
      if(it.type==="ad"||it.content)return h("iframe",{sandbox:"allow-scripts allow-popups",srcdoc:it.content||"",title:"Ad"});
      const f=it.file||{};
      const url=(f.md||f.hd||f.sm||{}).gif?.url;
      const full=(f.hd||f.md||f.sm||{}).gif?.url||url;
      if(!url)return null;
      return h("button",{type:"button",title:it.title||"GIF",onclick:()=>{send("",full);$("#gifs").hidden=true}},h("img",{src:url,alt:it.title||"GIF",loading:"lazy"}));
    }).filter(Boolean));
    if(!items.length)grid.textContent="No GIFs found.";
  }catch(e){fail("GIF search failed.")(e)}
}
</script>
</body>
</html>
